<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Partidos</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="contenedor">
    <section class="hero">
      <h1>Gestión de Partidos</h1>
      <p>Microservicio Frontend SPA conectado al Backend de Partidos</p>
    </section>

    <section class="card">
      <h2 id="form-title">Registrar partido</h2>

      <form id="partido-form">
        <input type="hidden" id="partido-id" />

        <label>Fecha del partido</label>
        <input type="date" id="fecha" required />

        <label>Equipo local</label>
        <select id="equipo_local_id" required>
          <option value="">Selecciona equipo local</option>
        </select>

        <label>Equipo visitante</label>
        <select id="equipo_visitante_id" required>
          <option value="">Selecciona equipo visitante</option>
        </select>

        <label>Goles local</label>
        <input type="number" id="goles_local" min="0" placeholder="Ejemplo: 2" required />

        <label>Goles visitante</label>
        <input type="number" id="goles_visitante" min="0" placeholder="Ejemplo: 1" required />

        <div class="botones">
          <button type="submit" id="btn-guardar">Guardar</button>
          <button type="button" id="btn-cancelar" class="secundario">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Lista de partidos</h2>
      <div id="mensaje"></div>
      <div id="partidos-lista" class="grid"></div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
